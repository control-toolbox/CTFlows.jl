name: GPU probe

# Runs the standalone GPU capability probe (probe/gpu/probe_gpu.jl) on the
# self-hosted NVIDIA/CUDA runner. Diagnostic only: it prints a capability matrix
# and always succeeds (experiments are individually try/catch'd). See
# probe/gpu/README.md.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

jobs:
  gpu-probe:
    # Run manually (workflow_dispatch) or on a PR carrying the 'run ci gpu' label.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run ci gpu')
    runs-on: ["kkt"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@latest
        with:
          version: '1'

      - name: Add ct-registry
        uses: julia-actions/add-julia-registry@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          registry: control-toolbox/ct-registry

      - name: Run GPU probe
        run: julia --project=probe/gpu probe/gpu/probe_gpu.jl
