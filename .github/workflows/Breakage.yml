name: Breakage
run-name: "Breakage${{ inputs.pr && format(' #{0}', inputs.pr) || '' }}"

# The packages that depend on CTFlows, derived from the Project.toml files of the
# organization, tested against it; one report per run. On push to main and by hand, the
# run is the baseline the next release PR compares with (REL1); see
# CTActions docs/workflows/breakage-suite.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number, set by label-dispatch.yml; empty by hand: the baseline run'
        required: false
        default: ''
      target:
        description: 'packages (label run breakage)'
        required: false
        default: ''

jobs:
  call:
    # On a pull request: the label run breakage, through Labels.yml. On push to main and by
    # hand without a pull request: always.
    if: inputs.pr == '' || inputs.target == 'packages'
    uses: control-toolbox/CTActions/.github/workflows/breakage-suite.yml@feat/149-label-dispatch
    with:
      use_ct_registry: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
