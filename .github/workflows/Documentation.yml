name: Documentation
run-name: "Documentation${{ inputs.pr && format(' #{0}', inputs.pr) || '' }}"

# On a pull request, `run documentation` starts a run through Labels.yml
# (CTActions docs/workflows/label-dispatch.md); `documentation push preview` added to it
# makes the build deploy its preview.

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'   # v0.5.0 yes, v0.5.0-beta no
  # run on a tag by ReleaseTag.yml: a tag it creates triggers no push event
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number, set by label-dispatch.yml'
        required: false
        default: ''
      preview:
        description: 'Deploy the preview of the pull request (label documentation push preview)'
        required: false
        default: 'false'

jobs:
  call:
    uses: control-toolbox/CTActions/.github/workflows/documentation.yml@feat/149-label-dispatch
    with:
      use_ct_registry: true
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
